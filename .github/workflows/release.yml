name: Build Apple Silicon DMG

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build DMG
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Apple Silicon runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Configure signing
        shell: bash
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_P12_BASE64:-}" ] || [ -z "${SIGNING_P12_PASSWORD:-}" ]; then
            echo "::warning::Signing secrets are not configured; falling back to ad-hoc signing."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi

          umask 077
          KEYCHAIN="$RUNNER_TEMP/oc-sign.keychain-db"
          SIGN_DIR="$HOME/Library/Application Support/offline-complete/signing"
          mkdir -p "$SIGN_DIR"
          printf '%s' "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$SIGNING_P12_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$SIGNING_P12_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_P12_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning
          printf '%s' "$SIGNING_P12_PASSWORD" > "$SIGN_DIR/keychain-password"
          chmod 0600 "$SIGN_DIR/keychain-password"
          echo "SIGN_IDENTITY=Offline Complete Dev" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "OC_SIGN_IMPORTED=1" >> "$GITHUB_ENV"

      - name: Build encrypted rules
        run: make encrypt

      - name: Run tests
        shell: bash
        run: |
          # Keep AF_UNIX socket paths short and under a private parent.
          rm -rf "$HOME/oc-tmp"
          mkdir -m 700 "$HOME/oc-tmp"
          TMPDIR="$HOME/oc-tmp" make test

      - name: Build signed DMG
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APP_VERSION="${RELEASE_TAG#v}"
          make dist APP_VERSION="$APP_VERSION" APP_BUILD="$RELEASE_BUILD"
          codesign --verify --deep --strict "dist/Offline Complete.app"
          shasum -a 256 dist/Offline-Complete.dmg > dist/Offline-Complete.dmg.sha256
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' 'dist/Offline Complete.app/Contents/Info.plist')"
          echo "build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' 'dist/Offline Complete.app/Contents/Info.plist')"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-complete-${{ github.ref_name }}
          path: |
            dist/Offline-Complete.dmg
            dist/Offline-Complete.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Offline Complete ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Offline-Complete.dmg
            dist/Offline-Complete.dmg.sha256
